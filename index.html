<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Golfa Klikšķeris</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topbar">
    <div class="stat-box">
      <h2 id="shots">0</h2>
      <p>Sitieni</p>
    </div>

    <div class="stat-box">
      <h2 id="chance">0%</h2>
      <p>Hole In One</p>
    </div>

    <div class="stat-box">
      <h2 id="perClick">50</h2>
      <p>Punkti/klikšķis</p>
    </div>

    <div id="rebirthProgressContainer" class="progress-container">
      <div id="rebirthProgressBar" class="progress-bar"></div>
      <span id="rebirthText">Rebirth: 0 / 2500</span>
    </div>
  </div>

  <div class="game-zone">
    <div class="upgrades-overlay">
      <h2 id="worldTitle">Sākums</h2>
      <h2 class="section-title">Upgrades</h2>

      <div class="upgrade">
        <h3>Hole In One</h3>
        <p>+3% chance</p>
        <button id="btnChance" class="disabled-btn">Pirkt - 200</button>
      </div>

      <div class="upgrade">
        <h3>Treniņi</h3>
        <p id="lessonsDesc">+10 punkti</p>
        <button id="btnLessons" class="disabled-btn">Pirkt - 200</button>
      </div>

      <div class="upgrade">
        <h3>Golfa mašīna</h3>
        <p id="cartDesc">+25 punkti</p>
        <button id="btnCart" class="disabled-btn">Pirkt - 700</button>
      </div>

      <div class="upgrade">
        <h3>Auto</h3>
        <p id="autoDesc">+50/s</p>
        <button id="btnAuto" class="disabled-btn">Rebirth 1</button>
      </div>
    </div>

    <div class="click-area" id="clickAreaZone">
      <div id="hioCornerNotice">HOLE IN ONE!</div>

      <div class="controls-container">
        <img id="clubBtn" src="https://images.unsplash.com/photo-1535131749006-b7f58c99034b?auto=format&fit=crop&w=200&q=80">
        <div class="click-text" id="clickInstruction">KLIKŠĶINI</div>
      </div>

      <div class="play-field">
        <div class="golf-track"></div>
        <div id="golfBall"></div>
        <div class="golf-hole">
          <div class="flagpole"></div>
          <div class="flag"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="spele.js"></script>
</body>
</html>
